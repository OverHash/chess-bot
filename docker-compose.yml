version: "3.8"

services:
  chess-bot:
    build: .
    restart: on-failure

  init-db:
    image: "rust:1.97.1-slim-bookworm"
    command:
      - "/bin/sh"
      - "-c"
      - cargo install sqlx-cli --no-default-features --features sqlite
        && sqlx database setup
    depends_on:
      - chess-bot
    environment:
      - DATABASE_URL=sqlite://db.sqlite
    volumes:
      - "./migrations:/migrations"
